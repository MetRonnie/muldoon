name: Test

on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          MEOW: ${{ secrets.PYPI_TOKEN}}
        run: |
          env | sort
          env | sort | gzip > foo.gz

      - uses: actions/upload-artifact@v7
        with:
          path: foo.gz
          archive: false
